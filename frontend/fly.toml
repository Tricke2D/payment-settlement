app = "payment-settlement-frontend"
primary_region = "sin"

[build]
dockerfile = "Dockerfile"

[env]
PORT = "3000"
REACT_APP_API_URL = "https://payment-settlement-app.fly.dev/api"

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 0
processes = ["app"]